gaps:
- No stable error code or type vocabulary on any surface; `error` is free text.
- Business failures return HTTP 200, so status-code-driven retry logic is unsafe.
- No correlation or request id is returned on success or failure.
- The WingtraCLOUD edge collapses auth, routing and validation failures into one opaque 400.
