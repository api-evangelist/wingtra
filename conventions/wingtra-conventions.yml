    Alongside the standard GraphQL errors[] array the schema models expected failures as
    data: ErrorResponse { error } and DroneErrorResponse { droneId, error } are returned
    inside union-like response objects, so a business failure arrives as a 200 with an
    `error` string rather than as a transport error.
