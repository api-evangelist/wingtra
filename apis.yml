aid: wingtra
name: Wingtra
description: 'Wingtra AG is a Swiss drone manufacturer headquartered at Giesshübelstrasse
  40 in Zürich, with a second office in Fort Lauderdale, Florida. It builds the WingtraOne
  GEN II and WingtraRAY VTOL tail-sitter mapping drones — fixed-wing aircraft that
  take off and land vertically — together with the RGB, multispectral and LiDAR payloads
  they carry, the WingtraGROUND GNSS base station, and the software that turns a flight
  into survey-grade output: the tablet-based Wingtra App for flight planning and capture,
  and the browser-based WingtraCLOUD for site organization, PPK geotagging, coordinate
  transformation across 6,500-plus published coordinate systems, photogrammetry processing
  and sharing, sold in WingtraESSENTIAL, WingtraPRO and WingtraUNLIMITED tiers. Wingtra
  publishes no developer portal, API reference, SDK or partner API program. Its machine-readable
  surface is incidental rather than offered: the customer and partner portal at my.wingtra.com
  is backed by a GraphQL API at api.my.wingtra.com whose schema answers anonymous introspection,
  and the WingtraCLOUD web client calls a versioned REST API at api.sky.wingtra.com that
  is closed to unauthenticated callers. Integration with the wider geospatial toolchain
  is delivered as file exchange — Trimble Business Center, ArcGIS Online, Propeller,
  Pix4D, Bentley iTwin and DroneDeploy — not as an API.'
