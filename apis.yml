- aid: wingtra-cloud-api
  name: WingtraCLOUD API
  description: The versioned REST API the WingtraCLOUD browser client at cloud.wingtra.com
    calls — sites, flights, drones, layers, jobs, tenants, file registration and presigned
    upload, archiving, survey outcomes, and a coordinate-systems and transformation
    service. Wingtra publishes no specification, reference or key programme for it,
    and every unauthenticated request to the host is answered HTTP 400 "Something went
    wrong." by an edge in front of the application, so no contract could be harvested.
    Recorded as a real, named API surface with no published contract.
  image: https://wingtra.com/wp-content/uploads/wingtra-essential.jpg
