apis:
- aid: wingtra-portal-graphql
  name: Wingtra Customer and Partner Portal GraphQL API
  description: The GraphQL API behind my.wingtra.com, Wingtra's customer and partner
    portal. The schema answers anonymous introspection and returns 84 types, 38 query
    root fields and 33 mutations covering drone registration and setup, drone and empty-wing
    replacement eligibility under warranty, PPK/LiDAR/Blue-sUAS licence configuration
    and transfer, payload registration including WingtraRAY options, WingtraCARE plan
    updates, reseller and distributor tenancy, company and contact profiles, and SSO
    token exchange for the HubSpot, Thinkific, Canny and Sky (WingtraCLOUD) surfaces.
    Wingtra does not document, version or advertise this API, and issues no developer
    credentials for it — it is the portal's private back end, publicly introspectable.
  image: https://wingtra.com/wp-content/uploads/wingtraray-full-end-to-end-solution.png
  humanURL: https://my.wingtra.com/
  baseURL: https://api.my.wingtra.com/graphql
