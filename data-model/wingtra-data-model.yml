surfaces:
  graphql: https://api.my.wingtra.com/graphql
  rest: https://api.sky.wingtra.com (no contract published)
  note: >-
    The WingtraCLOUD REST surface almost certainly carries the operational half of the
    domain — sites, flights, layers, jobs, files — but it publishes no schema and is closed
    to anonymous callers, so no entity from it is modelled here. Doing so would mean
    inventing a data model from route names.
