  - {name: RINEX, role: consumer (GNSS observation exchange), evidence: 'https://wingtra.com/software/'}
  - {name: 'ASPRS LAS/LAZ', role: producer/consumer (point cloud output), evidence: 'https://wingtra.com/software/'}
  - {name: OGC KML 2.2, role: consumer (flight plan import), evidence: 'https://wingtra.com/software/plans/'}
