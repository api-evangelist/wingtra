domain_standard:
  market: geospatial / aerial survey
  declared_in_contract: false
  detail: >-
    Nothing in the GraphQL schema declares a domain standard — no OGC conformance class, no
    SCIM URN, no OData $metadata, no OAI-PMH verb. Probing for an OGC surface was not
    warranted: no baseURL, docs link or prose names WMS/WFS/WCS/WMTS/CSW or "OGC API" as
    something Wingtra serves. Where geospatial standards appear at all, Wingtra is the
    CONSUMER — WingtraPRO imports WMS layers published by others, and the software resolves
    against 6,500+ published EPSG coordinate system definitions and reads Trimble .T02/.T04
    and RINEX. Consuming a standard is not conformance to it, and this is a reward-only
    dimension, so nothing is claimed.
  consumed_standards:
