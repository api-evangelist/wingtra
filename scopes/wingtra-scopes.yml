note: >-
  Wingtra publishes no scope or permission reference — there is no developer portal to
  publish one on. The scopes below are the `scopes_supported` array the Wingtra Auth0
  tenant serves in its own OIDC discovery document, fetched anonymously. They are standard
  OIDC identity scopes: the tenant advertises no Wingtra product scope (nothing for drones,
  licences, sites, flights or files), which means the portal GraphQL API and the
  WingtraCLOUD REST API do not express authorization as OAuth scopes. Authorization is
  carried instead by tenant membership and by the `assigned_roles` array the login mutation
  returns, neither of which is documented publicly. scope_count counts what is served, not
  what governs the API.
